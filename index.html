<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#0a0730">
    <meta name="language" content="Arabic">
    <meta name="robots" content="index, follow">
    <title>شباب بتساعد شباب - نموذج تسجيل حضور لفعالية شباب بتساعد شباب</title>
    <meta name="description" content="نموذج تسجيل حضور متكامل وواجهة مستخدم عصرية لفعاليات مبادرة SBS، يتيح للزوار تسجيل بياناتهم واختيار الفعالية المناسبة">
  <meta name="keywords" content="فرص تعليمية، منح دراسية، دورات تدريبية، مسابقات شبابية، التطوير الذاتي">
  <meta property="og:title" content="شباب بتساعد شباب - تمكين الشباب من خلال التعليم">
  <meta property="og:description" content="منصة شبابية رائدة لتمكين الشباب العربي من خلال ربطهم بأفضل الفرص التعليمية والموارد القيمة">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://moatasem-osama.github.io/SBS/">
  <meta property="og:site_name" content="شباب بتساعد شباب">
  <meta property="og:locale" content="ar_EG">
  <meta property="og:image" content="https://moatasem-osama.github.io/SBS/imgs/sbs-logo.webp">
  <link rel="canonical" href="https://moatasem-osama.github.io/SBS/">
    <link rel="icon" type="image/x-icon" href="imgs/sbs-logo.webp">
  </head>
  <body>
    <section class="container">
      <img src="imgs/sbs-logo.webp" alt="" />

      <div>
        <h1>نموذج تسجيل حضور لفعالية شباب بتساعد شباب</h1>
        <form action="" class="form">
          <label for="name">الاسم المسجل : </label>
          <br />
          <input type="text" name="name" id="name" required />
          <label for="email">البريد الالكتروني : </label>
          <br />
          <input type="email" name="email" id="email" required />
          <label for="phone">رقم الهاتف : </label>
          <br />
          <input type="tel" name="phone" id="phone" required />
          <label for="gender">النوع : </label>
          <br />
          <select name="gender" id="gender">
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
          </select>
          <label for="event">الفعالية التي تود حضورها : </label>
          <br />
          <select name="event" id="event">
            <option value="SBS Summer Camp">معسكر SBS الصيفي</option>
            <option value="universities scholarships">حدث منح الجامعات الأمريكية</option>
            <option value="volunteering with SBS">التطوع مع شباب بتساعد شباب</option>
          </select>
          <button type="submit">أرسل الآن</button>
        </form>
      </div>
    </section>
    <script src="main.js"></script>
  </body>
</html>
